{% macro button(text, id, type, hover, onclick, title, icon=None, color="slate-950", loading=True) %}
  <div x-data="{loading: false}">
    <button {% if loading %} @click="loading = true" :disabled="loading" {% endif %}
            id="{{ id }}"
            title="{{ title }}"
            {% if title %} aria-label="{{ title }}" {% endif %}
            type="{{ type }}"
            onclick="{{ onclick }}"
            class="{{ color }} p-2 rounded-md text-white {{ hover }} cursor-pointer flex items-center justify-center font-medium text-xs gap-2 w-full h-full text-center">
      {% if icon %}
        <i class="{{ icon }}"></i>
      {% endif %}
      {% if text %}
        <span>{{ text }}</span>
      {% endif %}
      <span x-show="loading" class="flex items-center" style="display: none;">
        <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white"
             xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
      </span>
    </button>
  </div>
{% endmacro %}
