{% macro button(text, type, hover, onclick, title, icon=None, color="slate-950")
%}
<div x-data="{loading: false}">
  <button
  @click="loading = true"
  :disabled="loading"
  title="{{title}}"
  type="{{ type }}"
  onclick="{{ onclick }}"
  class="bg-{{ color }} p-2 rounded-lg text-white items-center hover:bg-{{ hover }} cursor-pointer inline-flex items-center font-semibold px-4 py-2 text-xs gap-2"
>
  {% if icon %}
    <i class="{{ icon }}"></i>
  {% endif %} {% if text %}
    <span>{{ text }}</span>
  {% endif %}
    <span x-show="loading" class="flex items-center" style="display: none;">
      <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      >
      </svg>
    </span>
  </button>
</div>

{% endmacro %}
